name: Generate SBOM

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Fix: Add explicit permission for release uploads

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4  # Keep v4 for compatibility

    - name: Setup Python
      uses: actions/setup-python@v5  # Keep v5 as it's stable
    
    - name: Generate SBOM
      run: python scripts/generate_sbom.py
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2  # Fix: Update to v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          sbom_cyclonedx.json
          sbom_spdx.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: |
          sbom_cyclonedx.json
          sbom_spdx.json
        retention-days: 90