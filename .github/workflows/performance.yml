name: Performance Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Start analyzer service
        run: docker compose up -d analyzer
      
      - name: Wait for analyzer
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.8100/health; then
              echo "Analyzer is ready"
              exit 0
            fi
            echo "Waiting for analyzer..."
            sleep 2
          done

          echo "Analyzer failed to become ready"
          docker compose logs analyzer
          exit 1
          
      - uses: grafana/setup-k6-action@v1

      - name: Run k6 analysis load test
      - run: k6 run load-tests/analyze.js
